; Roue de la Chance — réglages PHP
upload_max_filesize = 16M
post_max_size = 20M
memory_limit = 256M
max_execution_time = 60
expose_php = Off
date.timezone = UTC
display_errors = Off
log_errors = On

; Le code ne change pas pendant que le conteneur tourne
opcache.enable = 1
opcache.memory_consumption = 64
opcache.validate_timestamps = 0
