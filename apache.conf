# Roue de la Chance — réglages Apache
# Ces protections sont actives même si les fichiers .htaccess du site n'ont pas été envoyés.
ServerTokens Prod
ServerSignature Off
ServerName localhost

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# Dossiers internes : jamais servis
RedirectMatch 404 ^/(app|data)(/|$)
<FilesMatch "\.(sqlite|sqlite-wal|sqlite-shm|db|log|ini|lock|md|tmp)$">
    Require all denied
</FilesMatch>

# Photos envoyées (sur le disque permanent) : jamais exécutées comme du code
<DirectoryMatch "^/var/(www/html|data)/uploads">
    Options -Indexes
    <IfModule php_module>
        php_admin_flag engine off
    </IfModule>
    <FilesMatch "\.(php|phtml|phar|php[0-9])$">
        Require all denied
    </FilesMatch>
</DirectoryMatch>

<IfModule headers_module>
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "same-origin"
</IfModule>
